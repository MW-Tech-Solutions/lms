<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark pine green gradient for cap -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003D32" />
      <stop offset="50%" stop-color="#002D25" />
      <stop offset="100%" stop-color="#00221C" />
    </linearGradient>
    <!-- Vibrant emerald green gradient for book pages -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="30%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Gold gradient for tassel -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="atc-emblem" filter="url(#subtleShadow)">
    <!-- 1. GRADUATION CAP -->
    <!-- Diamond Top (Mortarboard) -->
    <polygon points="256,40 470,140 256,236 42,140" fill="url(#capGrad)" />
    <!-- Mortarboard edge highlight -->
    <polyline points="42,140 256,236 470,140" fill="none" stroke="#004D40" stroke-width="3" />

    <!-- Cap Skull Base -->
    <path d="M 148,188 L 148,252 C 148,252 186,300 256,300 C 326,300 364,252 364,252 L 364,188 C 340,204 300,218 256,218 C 212,218 172,204 148,188 Z" fill="url(#capGrad)" />

    <!-- Golden Tassel -->
    <!-- Button on top -->
    <ellipse cx="256" cy="138" rx="8" ry="5" fill="url(#goldGrad)" />
    <!-- Tassel string curving over right side -->
    <path d="M 256,138 Q 330,150 376,190 L 376,235" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Tassel ring & drop -->
    <circle cx="376" cy="238" r="4" fill="#D97706" />
    <polygon points="372,242 380,242 383,286 369,286" fill="url(#goldGrad)" />
    <ellipse cx="376" cy="286" rx="7" ry="2.5" fill="#B45309" />

    <!-- 2. OPEN BOOK PAGES (Emerald Green) -->
    <!-- Left Page -->
    <path d="M 244,286 C 180,286 98,250 56,242 C 50,241 46,246 46,252 L 46,396 C 46,401 50,405 56,407 C 104,416 186,444 244,482 C 248,485 252,482 252,476 L 252,292 C 252,288 248,286 244,286 Z" fill="url(#pageGrad)" />
    
    <!-- Right Page -->
    <path d="M 268,286 C 332,286 414,250 456,242 C 462,241 466,246 466,252 L 466,396 C 466,401 462,405 456,407 C 408,416 326,444 268,482 C 264,485 260,482 260,476 L 260,292 C 260,288 264,286 268,286 Z" fill="url(#pageGrad)" />

    <!-- 3. BOOK OUTER BINDING / SHIELD FRAME (Dark Pine Green) -->
    <!-- Left Outer Binding Wall -->
    <path d="M 32,254 L 32,410 C 32,418 38,425 46,427 C 106,442 190,472 252,506 C 255,508 257,508 260,506 C 322,472 406,442 466,427 C 474,425 480,418 480,410 L 480,254 C 480,248 474,244 468,246 L 460,248 C 456,249 454,252 454,256 L 454,398 C 398,412 324,440 256,478 C 188,440 114,412 58,398 L 58,256 C 58,252 56,249 52,248 L 44,246 C 38,244 32,248 32,254 Z" fill="url(#capGrad)" />

    <!-- Center Spine Highlight -->
    <path d="M 252,290 L 256,290 L 260,290 L 260,480 L 256,483 L 252,480 Z" fill="#003D32" opacity="0.3" />
  </g>
</svg>