<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <style>
      .brand-bold-dark { font-family: 'Montserrat', 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 110px; fill: #00362F; letter-spacing: -1px; }
      .brand-bold-green { font-family: 'Montserrat', 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 110px; fill: #00A859; letter-spacing: -1px; }
      .tagline { font-family: 'Segoe UI', 'Montserrat', sans-serif; font-weight: 600; font-size: 32px; fill: #00362F; letter-spacing: 12px; }
      .dot { fill: #00A859; font-size: 28px; }
    </style>
  </defs>

  <!-- ATC Emblem -->
    <g transform="translate(40, 20) scale(0.55)">
