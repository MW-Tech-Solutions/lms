    <path d="M 256,138 Q 330,150 376,190 L 376,235" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round" />
    <circle cx="376" cy="238" r="4.5" fill="#B45309" />
    <polygon points="372,242 380,242 383,286 369,286" fill="#D97706" />
    <ellipse cx="376" cy="286" rx="7" ry="2.5" fill="#B45309" />
    <!-- Book Pages (Emerald) -->
    <path d="M 244,286 C 180,286 98,250 56,242 C 50,241 46,246 46,252 L 46,396 C 46,401 50,405 56,407 C 104,416 186,444 244,482 C 248,485 252,482 252,476 L 252,292 C 252,288 248,286 244,286 Z" fill="#10B981" />
    <path d="M 268,286 C 332,286 414,250 456,242 C 462,241 466,246 466,252 L 466,396 C 466,401 462,405 456,407 C 408,416 326,444 268,482 C 264,485 260,482 260,476 L 260,292 C 260,288 264,286 268,286 Z" fill="#10B981" />
    <!-- Book Binding (Dark Pine) -->
    <path d="M 32,254 L 32,410 C 32,418 38,425 46,427 C 106,442 190,472 252,506 C 255,508 257,508 260,506 C 322,472 406,442 466,427 C 474,425 480,418 480,410 L 480,254 C 480,248 474,244 468,246 L 460,248 C 456,249 454,252 454,256 L 454,398 C 398,412 324,440 256,478 C 188,440 114,412 58,398 L 58,256 C 58,252 56,249 52,248 L 44,246 C 38,244 32,248 32,254 Z" fill="#00362F" />
  </g>

  <!-- Typography -->
  <text x="350" y="175">
    <tspan class="brand-bold-dark">AllThings</tspan><tspan class="brand-bold-green">Cambridge</tspan>
  </text>
  <text x="355" y="248" class="tagline">
    LEARN  <tspan class="dot">•</tspan>  GROW  <tspan class="dot">•</tspan>  ACHIEVE
