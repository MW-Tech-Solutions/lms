    <polyline points="42,140 256,236 470,140" fill="none" stroke="#004D40" stroke-width="4" />
    <!-- Cap Skull Base -->
    <path d="M 148,188 L 148,252 C 148,252 186,300 256,300 C 326,300 364,252 364,252 L 364,188 C 340,204 300,218 256,218 C 212,218 172,204 148,188 Z" fill="#00362F" />
    <!-- Golden Tassel -->
